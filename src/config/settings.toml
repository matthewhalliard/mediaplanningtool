# available directory themes:
# spearmint, peppermint, hemingway, brookmint
theme = 'spearmint'

[general]
title = "Media Planning Tools 2026"
logo = ""
iconLogo = "tabler:chart-line"

[general.seo]
name = "Best Media Planning Tools 2026 — Compare 47+ Platforms"
description = "Compare 47+ media planning tools side-by-side. See pricing, features, and real reviews for Adobe Advertising Cloud, Trade Desk, DV360, and more. Free in 2026."
url = "https://www.mediaplanningtool.com"

[listings]
pageHeader = "title"

[directoryData]
[directoryData.source]
name = "default"    # default, mock, sheets, json
linksOutbound = false

[directoryData.tagPages]
