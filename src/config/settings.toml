[directoryUI]
[directoryUI.grid]
type = "rectangle-card-grid"

[directoryUI.grid.emptyState]
text = "No tools found"
type = "simple"
icon = "tabler:search-off"

[directoryUI.grid.card]
image = true

[directoryUI.grid.submit]
show = false
first = true
title = "Submit a Tool"
description = "Add your media planning tool to our directory"
hideable = true

[directoryUI.search]
showCount = true
icon = "tabler:search"

[directoryUI.search.tags]
display = "select"
intersection = false

[directoryUI.featured]
showOnAllPages = true
showOnSide = true
icon = "tabler:star"
labelForCard = "Featured"

